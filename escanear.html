<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escanear QR – Control de horas</title>
<meta name="theme-color" content="#5C2D91">
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#15101d;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{background:#5C2D91;padding:max(16px,env(safe-area-inset-top)) 18px 14px}
header small{color:#CDB8EA;font-size:13px;display:block}
header h1{font-size:20px;font-weight:600;margin-top:2px}
.cam{position:relative;flex:1;min-height:60vh;overflow:hidden;background:#000}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guia{position:absolute;left:50%;top:50%;width:min(68vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22px;
  box-shadow:0 0 0 9999px rgba(21,16,29,.55);border:3px solid #CDB8EA}
.estado{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:16px;font-weight:600;text-shadow:0 1px 3px #000;padding:0 16px}
.ok .guia{border-color:#7BE0B0}
.pie{padding:14px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:#15101d}
.btn{display:block;text-align:center;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;text-decoration:none;cursor:pointer;width:100%}
.prim{background:#5C2D91;color:#fff}
.sec{background:#fff;color:#5C2D91}
.err{background:#FCEBEB;color:#791F1F;border-radius:10px;padding:12px;font-size:14px;line-height:1.4}
.hide{display:none}
</style>
</head>
<body>
<header><small>Control de horas</small><h1>Escaneá el QR de la oficina</h1></header>
<div class="cam" id="cam">
  <video id="v" playsinline muted autoplay></video>
  <div class="guia"></div>
  <div class="estado" id="estado">Abriendo la cámara…</div>
</div>
<div class="pie">
  <div class="err hide" id="err"></div>
  <button class="btn sec hide" id="btnFoto">Sacar una foto del QR</button>
  <input type="file" id="foto" accept="image/*" capture="environment" class="hide">
  <a class="btn prim" id="volver" href="#">Volver a la app</a>
</div>
<script src="config.js"></script>
<script src="jsQR.js"></script>
<script>
{
  const APP_URL = window.APP_URL || '';
  const v = document.getElementById('v'), estado = document.getElementById('estado'), err = document.getElementById('err');
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  let stream = null, listo = false, ultimo = 0;
  document.getElementById('volver').href = APP_URL || '#';

  function token(texto) {
    const m = /[?&]qr=([A-Za-z0-9_-]+)/.exec(texto || '');
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{8,64}$/.test((texto || '').trim()) ? texto.trim() : '';
  }
  function irALaApp(t) {
    if (listo) return; listo = true;
    document.getElementById('cam').classList.add('ok');
    estado.textContent = '✓ QR leído. Volviendo a la app…';
    try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
    if (stream) stream.getTracks().forEach(x => x.stop());
    setTimeout(() => location.replace(APP_URL + (APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'qr=' + encodeURIComponent(t)), 250);
  }
  function mostrarError(t) {
    err.textContent = t; err.classList.remove('hide');
    document.getElementById('btnFoto').classList.remove('hide');
    estado.textContent = '';
  }
  function leer(fuente, w, h) {
    const k = Math.min(1, 720 / Math.max(w, h)), W = Math.round(w * k), H = Math.round(h * k);
    cv.width = W; cv.height = H; cx.drawImage(fuente, 0, 0, W, H);
    const q = jsQR(cx.getImageData(0, 0, W, H).data, W, H, { inversionAttempts: 'dontInvert' });
    return q && q.data ? q.data : '';
  }
  function bucle(ts) {
    if (listo) return;
    if (ts - ultimo > 140 && v.readyState >= 2 && v.videoWidth) {
      ultimo = ts;
      const texto = leer(v, v.videoWidth, v.videoHeight), t = token(texto);
      if (t) return irALaApp(t);
      if (texto) estado.textContent = 'Ese QR no es el de la oficina';
    }
    requestAnimationFrame(bucle);
  }
  async function iniciar() {
    if (!APP_URL) return mostrarError('Falta configurar el link de la app (archivo config.js).');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return mostrarError('Este navegador no deja usar la cámara acá. Usá "Sacar una foto del QR".');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      v.srcObject = stream; await v.play();
      estado.textContent = 'Apuntá al QR';
      requestAnimationFrame(bucle);
    } catch (e) {
      mostrarError(e && e.name === 'NotAllowedError'
        ? 'No hay permiso para usar la cámara. Activalo en la configuración del navegador para este sitio, o usá "Sacar una foto del QR".'
        : 'No se pudo abrir la cámara. Usá "Sacar una foto del QR".');
    }
  }
  document.getElementById('btnFoto').onclick = () => { const f = document.getElementById('foto'); f.value = ''; f.click(); };
  document.getElementById('foto').onchange = function () {
    const f = this.files && this.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { const t = token(leer(img, img.width, img.height)); URL.revokeObjectURL(url); t ? irALaApp(t) : mostrarError('No encontré el QR en la foto. Probá de nuevo, más cerca.'); };
    img.src = url;
  };
  iniciar();
}
</script>
</body>
</html>
